<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click & Slide</title>
</head>

<style>
    html {
        background-color: black;
        font-family: 'Courier New', Courier, monospace;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 60vw;
    }

    #buttons {
        margin-bottom: 20px;
    }

    #buttons button {
        background-color: white;
        color: #9C0F0C;
        font-weight: bold;
        height: 50px;
        width: 100px;
        font-size: large;
    }

    #four,
    #five,
    #six {
        margin-left: 20px;
    }

    #square {
        border: 1px solid #9C0F0C;
        width: 600px;
        height: 600px;
        background-repeat: no-repeat;
        background-size: 600px 600px;
        flex-wrap: wrap;
        position: relative;
        font-size: 0;
    }

    #clock {
        width: 20vw;
        height: 10vh;
        color: white;
        font-size: large;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
    }

    #main {
        display: flex;
        flex-direction: row;
    }

    #ranking {
        width: 40vw;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
        padding-top: 20px;
    }

    #ranking table {
        border: 1px solid #5C0907;
        border-spacing: 0;
        width: 100%;
    }

    .rows {
        border: 1px solid #5C0907;
        background-color: white;
    }

    .rows td {
        border: 1px solid #5C0907;
        font-size: 1.5em;
        background-color: white;
        color: #9C0F0C;
        padding: 10px;
        text-align: center;
    }

    #table_label {
        background-color: #9C0F0C;
        border: 1px solid #5C0907;
    }

    #table_label td {
        background-color: #9C0F0C;
        border: 1px solid #5C0907;
        font-size: 1.5em;
        text-align: center;
        padding: 10px;
    }

    #ranking_label {
        color: white;
        font-size: 2em;
        margin-top: 20px;
        margin-bottom: 20px;
        visibility: hidden;
    }

    #slider {
        width: 200px;
        height: 200px;
        margin-top: 20px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: row;
        overflow: hidden;
    }

    .arrows {
        color: white;
        font-size: 2em;
        width: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .slider_image img {
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
    }

    .slider_image {
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
    }

    #slider_container {
        display: flex;
        flex-direction: row;
        width: 300px;
    }

    .tile {
        border-spacing: 0;
        padding: 0;
        margin: 0;
    }

    .game_description {
        margin-top: 50px;
        color: #9C0F0C;
        font-size: 2em;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 50px;
    }

    #choose_img {
        height: 40px;
    }
</style>

<body>

    <script>
        var background_scr = ""

        var clicks = 0

        function change_background(img) {
            document.getElementById("choose_img").innerText = ""
            background_scr = img.src;
            background_scr = "url('" + background_scr + "')"
            console.log(background_scr)
            var div = document.createElement("DIV")
            div.style.color = "white"
            if (clicks > 0) {
                div.innerText = "Zmieniono obraz"
            } else {
                div.innerText = "Wybrano obraz"
            }
            document.getElementById("choose_img").appendChild(div)

            clicks++
        }


    </script>

    <div id="main">
        <div id="container">
            <div class="game_description" style="padding: 20px; text-align: center; margin-bottom: 10px;">Aby rozpocząć
                grę wybierz obraz a następnie tryb gry.</div>
            <div class="game_description" style="margin-top: 10px;">Nie zapomnij o podaniu nicku!</div>

            <div id="slider_container">
                <a id="arrow_left" class="arrows">&#10094;</a>
                <div id="slider">

                    <div class="slider_image">
                        <img onclick="change_background(this)" src="https://i.imgflip.com/1472cz.jpg" alt="img1"
                            style="cursor: pointer;">
                    </div>

                    <div class="slider_image">
                        <img onclick="change_background(this)"
                            src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg" alt="img2"
                            style="cursor: pointer;">
                    </div>

                    <div class="slider_image">
                        <img onclick="change_background(this)"
                            src="https://pbs.twimg.com/profile_images/437512776362115072/7ORMrPZN.jpeg" alt="img3"
                            style="cursor: pointer;">
                    </div>

                    <div class="slider_image">
                        <img onclick="change_background(this)" src="https://i.imgflip.com/1472cz.jpg" alt="img1"
                            style="cursor: pointer;">
                    </div>

                </div>
                <a id="arrow_right" class="arrows">&#10095;</a>
            </div>

            <div id="choose_img"></div>

            <div id="buttons">
                <button id="three">3 x 3</button>
                <button id="four">4 x 4</button>
                <button id="five">5 x 5</button>
                <button id="six">6 x 6</button>
            </div>
            <div id="clock">
                <div id="div_hours"></div>
                <div id="colon1"></div>
                <div id="div_minutes"></div>
                <div id="colon2"></div>
                <div id="div_secunds"></div>
                <div id="dot"></div>
                <div id="div_milisecunds"></div>
            </div>
            <div id="square"></div>
        </div>
        <div id="ranking">
            <div class="game_description"
                style="font-size: 1.5em; color: white; text-align: center; margin-bottom: 10px;">Podaj swój nick, aby
                móc być dodanym do tabeli w razie pobicia rekordu:</div>
            <input type="text" value="Nie podano nicku" id="input_nick"
                style="background-color: white; color: #5C0907; border: 2px solid #5C0907; width: 400px; font-family: 'Courier New', Courier, monospace; margin-bottom: 20px;">

            <div id="ranking_label"></div>

            <div id="ranking_table_div"></div>


        </div>

    </div>



    <script>

        var auxiliary_variables = {
            a: 0,
            tile_pos_x: "",
            tile_pos_y: "",
            empty_tile_pos_x: "",
            empty_tile_pos_y: "",
            can_move: false,
            pos_x: 0,
            pos_y: 0,
            game_board_array: "",
            can_start_check: false,
            can_make_tiles: false,
            user_done_playing: false
        };

        // SLIDER
        var slider_slide = document.querySelector("#slider")

        var button_left = document.querySelector("#arrow_left")
        var button_right = document.querySelector("#arrow_right")
        console.log(slider_slide.scrollLeft)


        slider_slide.scrollLeft = 200;

        button_right.addEventListener("click", function () {
            var scroll_position = 0
            var move_to_next_img = setInterval(function () {
                slider_slide.scrollLeft += 10;
                scroll_position += 10;
                if (scroll_position >= 200) {
                    window.clearInterval(move_to_next_img);
                }
            }, 25);

            if (slider_slide.scrollLeft == 600) {
                slider_slide.scrollLeft = 0
            }
        })


        button_left.addEventListener("click", function () {
            var scroll_position = 0
            var move_to_next_img = setInterval(function () {
                slider_slide.scrollLeft -= 10;
                scroll_position += 10;
                if (scroll_position >= 200) {
                    window.clearInterval(move_to_next_img);
                }
            }, 25);

            if (slider_slide.scrollLeft == 0) {
                slider_slide.scrollLeft = 800
            }
        })





        // ZEGAR
        var timer_stop = ""
        var timer_start = ""
        var get_the_time = false

        var stop_timer = true
        var displayed_time = ""

        var div_ms = document.getElementById("div_milisecunds")
        var div_s = document.getElementById("div_secunds")
        var div_m = document.getElementById("div_minutes")
        var div_h = document.getElementById("div_hours")

        var colon1 = document.getElementById("colon1")
        var img_colon1 = document.createElement("IMG")
        img_colon1.src = "colon.gif"
        colon1.appendChild(img_colon1)
        colon1.style.visibility = "hidden"

        var colon2 = document.getElementById("colon2")
        var img_colon2 = document.createElement("IMG")
        img_colon2.src = "colon.gif"
        colon2.appendChild(img_colon2)
        colon2.style.visibility = "hidden"


        var dot = document.getElementById("dot")
        var img_dot = document.createElement("IMG")
        img_dot.src = "dot.gif"
        dot.appendChild(img_dot)
        dot.style.visibility = "hidden"


        function change_time_to_img(time_unit, parent_time_unit) {


            parent_time_unit.innerHTML = ""
            for (var a = 0; a < String(time_unit).length; a++) {
                if (String(time_unit)[a] == 0) {

                    img.src = "c0.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 1) {

                    img.src = "c1.gif"

                }

                if (String(time_unit)[a] == 2) {
                    var img = document.createElement("IMG")
                    img.src = "c2.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 3) {
                    var img = document.createElement("IMG")
                    img.src = "c3.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 4) {
                    var img = document.createElement("IMG")
                    img.src = "c4.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 5) {
                    var img = document.createElement("IMG")
                    img.src = "c5.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 6) {
                    var img = document.createElement("IMG")

                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 7) {
                    var img = document.createElement("IMG")
                    img.src = "c7.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 8) {
                    var img = document.createElement("IMG")
                    img.src = "c8.gif"
                    parent_time_unit.appendChild(img)
                }

                if (String(time_unit)[a] == 9) {
                    var img = document.createElement("IMG")
                    img.src = "c9.gif"
                    parent_time_unit.appendChild(img)
                }
            }
        }

        var display_clock = ""
        function timer() {
            if (stop_timer == false) {
                colon1.style.visibility = "visible"
                colon2.style.visibility = "visible"
                dot.style.visibility = "visible"

                // Wyczyszczenie zegara - odnowa
                var secunds = 0

                let current_time = new Date()
                var display_time = current_time - start_time

                var milisecunds = display_time % 1000
                var secunds = Math.floor((display_time / 1000)) % 60
                var minutes = Math.floor((display_time / 60000)) % 60
                var hours = Math.floor((display_time / 3600000)) % 60

                var numbers = []

                if (milisecunds < 100) {
                    milisecunds = "0" + milisecunds
                }
                if (milisecunds < 10) {
                    milisecunds = "0" + milisecunds
                }
                if (secunds < 10) {
                    secunds = "0" + secunds
                }
                if (minutes < 10) {
                    minutes = "0" + minutes
                }
                if (hours < 10) {
                    hours = "0" + hours
                }

                display_clock = hours + ":" + minutes + ":" + secunds + "." + milisecunds

                change_time_to_img(milisecunds, div_ms)
                change_time_to_img(secunds, div_s)
                change_time_to_img(minutes, div_m)
                change_time_to_img(hours, div_h)


            } else if (stop_timer == true) {
                var display_time = start_time - start_time
                var milisecunds = display_time % 1000
                var secunds = Math.floor((display_time / 1000)) % 60
                var minutes = Math.floor((display_time / 60000)) % 60
                var hours = Math.floor((display_time / 3600000)) % 60

                if (secunds < 10) {
                    secunds = "0" + secunds
                }
                if (minutes < 10) {
                    minutes = "0" + minutes
                }
                if (hours < 10) {
                    hours = "0" + hours
                }

                change_time_to_img(milisecunds, div_ms)
                change_time_to_img(secunds, div_s)
                change_time_to_img(minutes, div_m)
                change_time_to_img(hours, div_h)
            } else {
                clearInterval(timer)
            }
        }

        // UKŁADANKA
        function search_tiles(item) {
            if (item.id != "empty") {
                // Szukanie pozycji elementu klikniętego w tablicy
                for (var a = 0; a < auxiliary_variables.game_board_array.length; a++) {
                    for (var b = 0; b < auxiliary_variables.game_board_array[a].length; b++) {
                        if (item == auxiliary_variables.game_board_array[a][b]) {
                            auxiliary_variables.tile_pos_y = a
                            auxiliary_variables.tile_pos_x = b
                        }
                    }
                }
            }

            // Szukanie pozycji elementu pustego w tablicy
            for (var a = 0; a < auxiliary_variables.game_board_array.length; a++) {
                for (var b = 0; b < auxiliary_variables.game_board_array[a].length; b++) {
                    if (auxiliary_variables.game_board_array[a][b].id == "empty") {
                        auxiliary_variables.empty_tile_pos_y = a
                        auxiliary_variables.empty_tile_pos_x = b
                    }
                }
            }
        }

        function random_move_tiles() {
            var game_tiles = document.querySelectorAll(".tile")
            var random_game_tile = game_tiles[Math.floor(Math.random() * game_tiles.length)];

            search_tiles(random_game_tile)

            // Warunki pozwalające na zmianę miejsca kafelka
            if ((auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x + 1 && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x - 1 && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y + 1) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y - 1)) {
                move_tiles(random_game_tile)
            } else {
                random_move_tiles()
            }

        }

        function check(element) {
            if (element == true) {
                return true
            }
        }

        function get_cookies() {
            var all_cookies = document.cookie.split("; ");
            var cookies_choosen_tryb_array = [];
            var cookie_position_array = [];

            for (var i = 0; i < all_cookies.length; i++) {
                var cookie = all_cookies[i].split("=");
                var cookie_name = cookie[0];
                var cookie_value = cookie[1];

                // Sprawdzenie, czy nazwa ciasteczka zawiera poprawny tryb gry
                if (cookie_name.includes("tryb" + cookie_tryb)) {
                    cookies_choosen_tryb_array.push(all_cookies[i]);
                }
            }

            console.log("Cookies for chosen mode:", cookies_choosen_tryb_array);

            for (var i = 0; i < cookies_choosen_tryb_array.length; i++) {
                var cookie_parts = cookies_choosen_tryb_array[i].split("=")[1].split("|");
                var recorded_time = parseFloat(cookie_parts[3]); // Czas zapisany w ciasteczku
                var position = parseInt(cookie_parts[5]); // Pozycja w rankingu

                if (recorded_time > display_clock) {
                    cookie_position_array.push(position);
                    console.log("Added position:", position);
                }
            }

            if (cookie_position_array.length > 0 && can_add_cookie) {
                cookie_position_array.sort((a, b) => a - b);
                new_cookie_position = cookie_position_array[0];

                var new_cookie_nick = document.getElementById("input_nick").value;
                if (new_cookie_nick.trim() !== "") {
                    set_cookie(cookie_tryb, new_cookie_position, new_cookie_nick, display_clock);
                } else {
                    console.warn("Nickname is empty, not saving the cookie.");
                }
            }

            // Aktualizacja tabeli wyników
            var cookie_table = [];

            for (var i = 0; i < all_cookies.length; i++) {
                var cookie = all_cookies[i].split("=");
                var cookie_name = cookie[0];

                if (cookie_name.includes("tryb" + cookie_tryb)) {
                    cookie_table.push(all_cookies[i]);
                }
            }

            cookie_table.sort();
            console.log("Selected mode cookie records:", cookie_table);

            document.getElementById("ranking_label").style.visibility = "visible";
        }


        var winner_div = document.createElement("DIV")
        var cookie_table = []
        function move_tiles(tile_to_move) {
            // Zamiana miejcami elementu klikniętego z elementem pustym w tablicy 
            auxiliary_variables.game_board_array[auxiliary_variables.tile_pos_y][auxiliary_variables.tile_pos_x] = auxiliary_variables.game_board_array[auxiliary_variables.empty_tile_pos_y][auxiliary_variables.empty_tile_pos_x]
            auxiliary_variables.game_board_array[auxiliary_variables.empty_tile_pos_y][auxiliary_variables.empty_tile_pos_x] = tile_to_move
            console.log("----- NASTĄPIŁA ZMIANA MIEJSC! NOWA TABLICA: -----")
            console.log(auxiliary_variables.game_board_array)
            auxiliary_variables.can_move = false

            // Zmiana wyglądu gry
            for (var a = 0; a < auxiliary_variables.game_board_array.length; a++) {
                for (var b = 0; b < auxiliary_variables.game_board_array[a].length; b++) {
                    document.getElementById("square").appendChild(auxiliary_variables.game_board_array[a][b])
                }
            }

            if (auxiliary_variables.can_start_check == true) {
                var t = 0;
                var done = []
                for (var a = 0; a < auxiliary_variables.game_board_array.length; a++) {
                    for (var b = 0; b < auxiliary_variables.game_board_array[a].length; b++) {
                        if (a == auxiliary_variables.game_board_array.length - 1 && b == auxiliary_variables.game_board_array[a].length - 1) {
                            done.push(auxiliary_variables.game_board_array[a][b].id == "empty")
                        } else {
                            done.push(auxiliary_variables.game_board_array[a][b].id == t)
                        }
                        t++
                    }
                }
                if (done.every(check) == true) {
                    can_add_cookie = true
                    stop_timer = "show_time"
                    winner_div.id = "winner_div"
                    winner_div.style.width = "600px"
                    winner_div.textContent = "Gratulację! Udało ci się ułożyć układankę! Uzyskany czas:" + display_clock
                    winner_div.style.zIndex = "1"
                    winner_div.style.margin = "20px"
                    winner_div.style.opacity = "1"
                    winner_div.style.fontWeight = "bold"
                    winner_div.style.color = "#9C0F0C"
                    winner_div.style.fontSize = "2em"
                    winner_div.height = "50px"
                    winner_div.width = "50px"
                    winner_div.style.display = "flex"
                    winner_div.style.justifyContent = "center"
                    winner_div.style.alignItems = "center"
                    auxiliary_variables.user_done_playing = true
                    winner_div.style.textAlign = "center"

                    document.getElementById("container").appendChild(winner_div)
                    document.getElementById("square").style.opacity = "0.5"
                    auxiliary_variables.can_start_check = false


                    // Aktualizacja rankingu
                    get_cookies()
                    update_table()
                }
            }

        }

        function get_tiles(table) {
            var game_tiles = document.querySelectorAll(".tile")

            auxiliary_variables.game_board_array = ""
            auxiliary_variables.game_board_array = new Array()
            auxiliary_variables.a = 0

            for (var i = 0; i < table; i++) {
                auxiliary_variables.game_board_array[i] = new Array()
                for (var j = 0; j < table; j++) {
                    auxiliary_variables.game_board_array[i][j] = game_tiles[auxiliary_variables.a]
                    auxiliary_variables.a++
                }
            }
            console.log(auxiliary_variables.game_board_array)

            for (var a = 0; a < game_tiles.length; a++) {
                game_tiles[a].addEventListener("click", function (event) {

                    if (event.target.id != "empty") {
                        search_tiles(event.target)

                        // Warunki pozwalające na zmianę miejsca kafelka
                        if ((auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x + 1 && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x - 1 && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y + 1) || (auxiliary_variables.empty_tile_pos_x == auxiliary_variables.tile_pos_x && auxiliary_variables.empty_tile_pos_y == auxiliary_variables.tile_pos_y - 1)) {
                            auxiliary_variables.can_move = true
                        }

                        if (auxiliary_variables.can_move == true) {
                            var target_tile = auxiliary_variables.game_board_array[auxiliary_variables.tile_pos_y][auxiliary_variables.tile_pos_x]
                            move_tiles(target_tile)
                        }

                    }
                })
            }
        }


        function split_image(dimensions, table) {
            document.getElementById("square").innerHTML = "";
            auxiliary_variables.pos_y = 0
            var j = 0;
            for (var a = 0; a < table; a++) {
                auxiliary_variables.pos_x = 0
                for (var b = 0; b < table; b++) {
                    var div = document.createElement("DIV")
                    div.style.height = dimensions + "px"
                    div.style.width = dimensions + "px"
                    div.style.backgroundSize = "600px 600px"
                    div.style.top = auxiliary_variables.pos_y + "px"
                    div.style.left = auxiliary_variables.pos_x + "px"
                    div.style.display = "inline-block"
                    div.style.backgroundPositionX = "-" + auxiliary_variables.pos_x + "px"
                    div.style.backgroundPositionY = "-" + auxiliary_variables.pos_y + "px"
                    div.className = "tile"
                    div.id = j
                    j++
                    if (a == table - 1 && b == table - 1) {
                        div.id = "empty"
                        div.style.backgroundColor = "black"
                    } else {
                        div.style.backgroundImage = background_scr
                    }
                    document.getElementById("square").appendChild(div)
                    auxiliary_variables.pos_x = auxiliary_variables.pos_x + dimensions
                }
                auxiliary_variables.pos_y = auxiliary_variables.pos_y + dimensions
            }
            get_tiles(table)
        }


        // COOKIE
        function set_cookie(tryb, postion, nick, czas) {
            var now = new Date();
            now.setMonth(now.getMonth() + 1);

            document.cookie = "cookie" + tryb + postion + "=nick|" + nick + "|czas|" + czas + "|position|" + postion + "; expires=" + now.toUTCString() + ";"
        }

        var cookie_tryb = ""




        // RANKING - TABELA
        function update_table() {
            cookie_table.sort(function (a, b) {
                a = a.split("=")[1].split("|")[5]
                b = b.split("=")[1].split("|")[5]
                console.log(a, b)

                return a - b;
            })

            console.log("POSEGREGOWAN")
